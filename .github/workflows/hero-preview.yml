name: Hero preview diagnostic

on:
  push:
    paths:
      - '.github/workflows/hero-preview.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Print compact hero previews
        run: |
          python - <<'PY'
          from PIL import Image
          import base64, io

          for path, label in [
              ("assets/hero-defense-2028.webp", "CURRENT"),
              ("assets/hero-no-brand.webp", "NOBRAND"),
              ("assets/hero-concept.png.png", "CONCEPT"),
          ]:
              try:
                  im = Image.open(path).convert("RGB")
              except Exception as e:
                  print(f"{label}_ERROR={e}")
                  continue
              print(f"{label}_SIZE={im.size[0]}x{im.size[1]}")
              thumb = im.copy()
              thumb.thumbnail((480, 320))
              buf = io.BytesIO()
              thumb.save(buf, format="JPEG", quality=72, optimize=True)
              data = base64.b64encode(buf.getvalue()).decode("ascii")
              print(f"{label}_B64_BEGIN")
              print(data)
              print(f"{label}_B64_END")
          PY
