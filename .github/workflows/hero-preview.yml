name: Hero preview diagnostic

on:
  push:
    paths:
      - '.github/workflows/hero-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Create compact hero previews
        run: |
          mkdir -p .github/tmp
          python - <<'PY'
          from PIL import Image
          import base64, io, pathlib

          for path, label in [
              ("assets/hero-defense-2028.webp", "current"),
              ("assets/hero-no-brand.webp", "nobrand"),
              ("assets/hero-concept.png.png", "concept"),
          ]:
              try:
                  im = Image.open(path).convert("RGB")
              except Exception as e:
                  pathlib.Path(f".github/tmp/{label}.txt").write_text(f"ERROR={e}\n")
                  continue
              thumb = im.copy()
              thumb.thumbnail((768, 512))
              buf = io.BytesIO()
              thumb.save(buf, format="JPEG", quality=78, optimize=True)
              b64 = base64.b64encode(buf.getvalue()).decode("ascii")
              pathlib.Path(f".github/tmp/{label}.txt").write_text(
                  f"SIZE={im.size[0]}x{im.size[1]}\nB64={b64}\n"
              )
          PY

      - name: Commit preview diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp/*.txt
          if git diff --cached --quiet; then
            echo "No preview changes"
          else
            git commit -m "Publish hero preview diagnostics"
            git push
          fi
