name: Update Samantha Soccer Schedule

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and convert Sprocket calendar
        run: python scripts/update_schedule.py
      - name: Commit schedule changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet || git commit -m "Update West Florida Flames schedule"
          git push
