name: Update latest Veo game

on:
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-latest-game.yml'
      - 'scripts/update_latest_game.py'

permissions:
  contents: write

jobs:
  update-latest-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Read newest public Veo recording
        run: python scripts/update_latest_game.py
      - name: Publish match data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-game.json
          git diff --cached --quiet || git commit -m "Update latest West Florida Flames game"
          git push
