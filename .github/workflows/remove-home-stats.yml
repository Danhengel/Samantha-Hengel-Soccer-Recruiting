name: Remove homepage stats text

on:
  push:
    paths:
      - '.github/workflows/remove-home-stats.yml'

permissions:
  contents: write

jobs:
  edit-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: pip install opencv-python-headless

      - name: Create clean frosted stats band
        run: |
          git show ba63531be7d34ca626850eaf90edb45b855967c8:assets/hero-defense-2028.webp > /tmp/original.webp
          python - <<'PY'
          import cv2
          import numpy as np

          src = cv2.imread("/tmp/original.webp", cv2.IMREAD_COLOR)
          if src is None:
              raise SystemExit("Could not read original hero image")

          h, w = src.shape[:2]
          sx, sy = w / 1536.0, h / 1024.0

          x1, y1, x2, y2 = [int(v) for v in (
              62*sx, 724*sy, 982*sx, 792*sy
          )]

          roi = src[y1:y2, x1:x2].copy()

          # Strong frosted-glass treatment removes embedded lettering
          # while retaining the player's leg and the underlying scene.
          blurred = cv2.GaussianBlur(roi, (0, 0), 18, 18)
          cream = np.full_like(roi, (246, 241, 238))
          frosted = cv2.addWeighted(blurred, 0.42, cream, 0.58, 0)

          # Feather the panel edges for a natural transition.
          rh, rw = roi.shape[:2]
          yy = np.minimum(np.arange(rh), np.arange(rh)[::-1]).astype(np.float32)
          xx = np.minimum(np.arange(rw), np.arange(rw)[::-1]).astype(np.float32)
          vy = np.clip(yy / max(1, int(6*sy)), 0, 1)
          vx = np.clip(xx / max(1, int(10*sx)), 0, 1)
          alpha = np.minimum(vy[:, None], vx[None, :])
          alpha = (1.00 * alpha)[..., None]

          blended = (roi * (1-alpha) + frosted * alpha).astype(np.uint8)
          out = src.copy()
          out[y1:y2, x1:x2] = blended

          ok = cv2.imwrite(
              "assets/hero-defense-2028.webp",
              out,
              [cv2.IMWRITE_WEBP_QUALITY, 96]
          )
          if not ok:
              raise SystemExit("Could not write edited hero image")
          PY

      - name: Commit edited hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-defense-2028.webp
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "Cleanly remove homepage stats strip text"
            git push
          fi
